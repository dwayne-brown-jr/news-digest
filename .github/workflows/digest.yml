name: digest

on:
  schedule:
    - cron: '0 13 * * *'   # 06:00 PT (PDT) — morning, 14h lookback
    - cron: '0 19 * * *'   # 12:00 PT (PDT) — midday,  6h lookback
    - cron: '0 3 * * *'    # 20:00 PT (PDT) — evening, 8h lookback (long-read bias)
  workflow_dispatch:
    inputs:
      window:
        description: Which window to run
        type: choice
        options: [morning, midday, evening]
        default: morning

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve window
        id: w
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * *") echo "window=morning" >> "$GITHUB_OUTPUT" ;;
            "0 19 * * *") echo "window=midday"  >> "$GITHUB_OUTPUT" ;;
            "0 3 * * *")  echo "window=evening" >> "$GITHUB_OUTPUT" ;;
            *)            echo "window=${{ inputs.window || 'morning' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py --window ${{ steps.w.outputs.window }}

      - name: Persist pause state
        if: always()
        run: |
          git config user.name  "news-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/pause.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "Update pause state [skip ci]"
            git push
          fi
